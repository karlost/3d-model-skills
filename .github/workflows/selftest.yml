name: selftest

on:
  push:
  pull_request:

jobs:
  printcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python skills/3d-print-design/scripts/selftest.py
